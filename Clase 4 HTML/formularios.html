<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Visualizacion de la pagina-->
    <title>Pagina Web</title> <!--El titulo de la pagina-->
</head>

<body>

    <!-- 
    FORM => se usa para declarar un formulario
    input => Se usa para declarar un campo de ingreso de informacion 
    Atributo type => Marca el tipo de input es, por defecto el valor es texto
    Atributo name => Marca programaticamente el nombre del campo
    Submit button => Sirve para desencadenar el evento de envio de formulario
    label => se usa para indicar  al usuario que informacion debe escribir en cada campo
    -->

<form>
 <h1>Iniciar sesion</h1>
 <div>
    <label>
        Ingrese su nombre de usuario:
    </label>
    <input type="text" name="username" value="Texto Prueba" required>
 </div>

  <div>
    <label for="">Ingrese su Email</label>
    <input type="email" id="correoPrueba" name="correoPrueba" placeholder="correo@gmail.com" required>
 </div>

  <div>
    <label for="">Ingrese su contraseña:</label>
    <input type="password" name="password">
 </div>

 <div>
    <label for="">Fecha de Nacimiento</label>
    <input type="date" name="birth-date">
 </div>
   <div>
    <span>Elige el pais de origen</span>
    <div>
        <div>
        <label>
             Argentina
             <input type="radio" name="orgin-country" checked value="AR">
        </label>
        <label>
             Francia
             <input type="radio" name="orgin-country" value="FR">
        </label>
        <label>
             Cabo Verde
             <input type="radio" name="orgin-country" value="CV">
        </label>
        </div>
    </div>

    <div>
    <span>Elige el motivo de ingreso</span>
    <div>
        <div>
        <label>
             Curiosidad
             <input type="checkbox" name="reason" checked value="1">
        </label>
        <label>
             Tramite
             <input type="checkbox" name="reason" value="2">
        </label>
        <label>
             Campaña Marketing
             <input type="checkbox" name="reason" value="3">
        </label>
        </div>
    </div>

    <div>
        <label for="Favorite_Color"> Seleccione un color favorito</label>
        <select name="Favorite_Color" id="Favorite_Color_id">
        <option value="red">Rojo</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option selected value="NA" disabled>No Seleccionado</option>
        </select>
    </div>
    <div>
        <label for="message">Mensaje:</label>
        <textarea name="message" id="message" rows="10" cols="20"></textarea>
    </div>
<button type="submit">Enviar</button>
</form>


</body>

</html>
