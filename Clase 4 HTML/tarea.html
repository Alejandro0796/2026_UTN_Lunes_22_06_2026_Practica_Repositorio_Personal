<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Prueba</title>
</head>

<body>

    <h1>Formulario de Prueba</h1>

    <form>
        <ul>
            <li>
                <label for="name">Nombre:</label>
                <input type="text" id="name_asociado" name="name_asociado">
            </li>

            <li>
                <label for="email">Email:</label>
                <input type="email" id="email_asociado" name="email">
            </li>

            <li>
                <label for="password">Password:</label>
                <input type="password" id="password_asociado" name="password_asociado">
            </li>

            <br>

            <li>
                Por favor inserte su pasión principal:

                <ul>
                    <li>
                        <label for="cocina">Cocina</label>
                        <input type="checkbox" id="cocina" name="emotion" value="cocina" checked>
                    </li>

                    <li>
                        <label for="deporte">Deporte</label>
                        <input type="checkbox" id="deporte" name="emotion" value="deporte">
                    </li>

                    <li>
                        <label for="baile">Baile</label>
                        <input type="checkbox" id="baile" name="emotion" value="baile">
                    </li>

                    <li>
                        <label for="videojuegos">Videojuegos</label>
                        <input type="checkbox" id="videojuegos" name="emotion" value="videojuegos">
                    </li>
                </ul>
            </li>

            <li>
                ¿Que te parece el servicio de esta pagina?

                <ul>
                    <li>
                        <label for="muy_buena">Muy Buena</label>
                        <input type="radio" id="muy_buena" name="satisfaction" value="muy_buena" checked>
                    </li>

                    <li>
                        <label for="buena">Buena</label>
                        <input type="radio" id="buena" name="satisfaction" value="buena">
                    </li>

                    <li>
                        <label for="regular">Regular</label>
                        <input type="radio" id="regular" name="satisfaction" value="regular">
                    </li>

                    <li>
                        <label for="malo">Malo</label>
                        <input type="radio" id="malo" name="satisfaction" value="malo">
                    </li>

                    <li>
                        <label for="muy_mejorable">Muy Mejorable</label>
                        <input type="radio" id="muy_mejorable" name="satisfaction" value="muy_mejorable">
                    </li>
                </ul>
            </li>

            <li>
                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="4" cols="35"></textarea>
            </li>

            <li>
                <label for="imagen">Imagen:</label>
                <input type="file" id="imagen" name="imagen">
            </li>

            <li>
                <label for="localizacion">Lugar Visitado:</label>
                <select id="localizacion" name="localizacion">
                    <option selected>Select location</option>
                    <option value="argentina">Argentina</option>
                    <option value="francia">Francia</option>
                    <option value="cabo_verde">Cabo Verde</option>
                    <option value="espana">España</option>
                    <option value="italia">Italia</option>
                </select>
            </li>

            <br>

            <li>
                <button type="submit">Ejecutar</button>
            </li>
        </ul>
    </form>

</body>

</html>
