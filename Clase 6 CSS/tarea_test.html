<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea CSS - Cajas</title>
    <link rel="stylesheet" href="./style_tarea_test.css">
</head>
<body>

    <main class="pagina">

        <!-- BLOQUE BANCO DE LA PAMPA -->
        <section class="bloque banco">
            <h1>banco de la pampa</h1>

            <p class="link">
                https://www.bancodelapampa.com.ar/
            </p>

            <div class="caja-externa caja-banco">
                <div class="boton-turnos">
                    TURNOS
                </div>
            </div>
        </section>


        <!-- BLOQUE FIGMA -->
        <section class="bloque figma">
            <p class="link">
                https://www.figma.com/color-contrast-checker/
            </p>

            <div class="caja-externa caja-figma">
                <div class="boton-negro">
                    Get color palette
                </div>
            </div>
        </section>


        <!-- BLOQUE CAN I USE -->
        <section class="bloque caniuse">
            <h2>Can i use</h2>

            <p class="link">
                https://caniuse.com/?search=webkit-text-stroke
            </p>

            <div class="caja-texto">
                <p>
                    Apoye las contribuciones de datos de la comunidad de GitHub .
                </p>
            </div>
        </section>

    </main>

</body>
</html>
