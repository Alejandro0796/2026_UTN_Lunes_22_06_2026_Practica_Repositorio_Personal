<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea CSS BOX</title>
    <link rel="stylesheet" href="./style_tarea.css">
</head>
<body>

    <main class="pagina">

        <!-- BLOQUE BANCO DE LA PAMPA -->
        <section class="bloque banco">
            <h1>Banco de la Pampa</h1>

            <p class="link">
                https://www.bancodelapampa.com.ar/
            </p>

            <div class="caja_externa caja_banco">
                <div class="boton_turnos">
                    TURNOS
                </div>
            </div>
        </section>


        <!-- BLOQUE FIGMA -->
        <section class="bloque figma">
            <p class="link">
                https://www.figma.com/color-contrast-checker/
            </p>

            <div class="caja_externa caja_figma">
                <div class="boton_negro">
                    Get color palette
                </div>
            </div>
        </section>


        <!-- BLOQUE CAN I USE -->
        <section class="bloque caniuse">
            <h2>Usted puede usar</h2>

            <p class="link">
                https://caniuse.com/?search=webkit-text-stroke
            </p>

            <div class="caja_texto">
                <p>
                    Apoye las contribucion de datos. Comunidad de Github
                </p>
            </div>
        </section>

    </main>

</body>
</html>
